# Specifies the build system requirements and backend
[build-system]
requires = [
    "hatchling",  # Build backend
    "hatch-vcs",  # Version control system plugin for dynamic versioning
    "setuptools", # Setuptools for compiling C extensions
    "wheel",      # Wheel for packaging
    "cython",     # Cython for compiling C extensions
    "numpy",      # NumPy for numerical operations and C extension includes
]
build-backend = "hatchling.build"


# Project metadata and configuration
[project]
name = "jcvi"
description = "Python utility libraries on genome assembly, annotation and comparative genomics"
readme = "README.md"
requires-python = ">=3.8"
license = "BSD-3-Clause"
authors = [
    { name = "Haibao Tang", email = "tanghaibao@gmail.com" },
    { name = "Vivek Krishnakumar" },
    { name = "Adam Taranto" },
]

classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "biopython",
    "CrossMap",
    "deap",
    "ete4",
    "matplotlib",
    "more-itertools",
    "natsort",
    "networkx",
    "numpy",
    "palettable",
    "pandas",
    "rich",
    "scipy",
    "seaborn",
]

dynamic = ["version"]

[project.optional-dependencies]
# Niche features; `pip install 'jcvi[all]'` installs everything except the
# extras listed after `all`, which need large or licensed downloads.
assembly = ["bitarray"] # k-mer binning in assembly.kmer
aws = ["boto3", "botocore"] # S3 helpers (jcvi.utils.aws)
excel = ["xlrd", "xlwt"] # formats.excel, projects.str spreadsheets
fetch = ["ftpretty"] # FTP listing in apps.base.ls_ftp
graphviz = ["pygraphviz"] # graph drawing (wheels bundle Graphviz)
grabseeds = [ # GRABSEEDS image analysis, PDF tools
    "pyefd",
    "pypdf",
    "pytesseract",
    "scikit-image",
    "Wand",
    "webcolors",
]
lp = ["ortools"] # OR-tools LP/TSP solvers
ngs = [ # BAM/BED/GFF/MAF actions needing bindings
    "bcbio-gff",
    "bx-python",
    "gffutils",
    "pybedtools",
    "pysam",
]
ontology = ["goatools"] # GO ontology parsing (formats.obo)
projects = ["jinja2", "matplotlib-venn", "scikit-learn"] # jcvi.projects scripts
variation = [ # VCF, CNV and imputation tools
    "cyvcf2",
    "hmmlearn",
    "holoviews",
    "hvplot",
    "pyfaidx",
    "pyliftover",
    "PyVCF3",
]
web = ["beautifulsoup4"] # HTML scraping in formats.html
all = [
    "jcvi[assembly,aws,excel,fetch,graphviz,grabseeds,lp,ngs,ontology,projects,variation,web]",
]
gurobi = ["gurobipy"] # Gurobi TSP solver; needs a licence
segment = ["segment-anything", "torch", "torchvision"] # SAM model in grabseeds
tests = [
    "jcvi[all]",
    "mock",
    "pytest-benchmark",
    "pytest-cov",
    "pytest",
    "PyYAML",
]

dev = [
    "black",
    "hatch",
    "isort",
    "numpydoc-validation",
    "pre-commit",
    "pymdown-extensions",
]

[project.urls]
homepage = "http://github.com/tanghaibao/jcvi"

# Command-line script entry point
[project.scripts]
jcvi = "jcvi.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
packages = ["src"]

[tool.hatch.build.hooks.custom]
path = "build.py"

[tool.hatch.build.hooks.vcs]
version-file = "src/jcvi/_version.py"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.vcs]
tag-pattern = "v*"
fallback-version = "0.0.0"

[tool.hatch.build.targets.sdist]
include = ["src/**/*.py", "src/**/*.pyx", "README.md"]
force-include = { "build.py" = "build.py", "setup.py" = "setup.py" }
exclude = ["src/jcvi/**/*.so", "src/jcvi/**/*.pyd", "src/jcvi/**/*.c"]

[tool.hatch.build.targets.wheel]
packages = ["src/jcvi"]
artifacts = [
    "src/jcvi/**/*.so",  # Linux/Mac shared objects
    "src/jcvi/**/*.pyd", # Windows shared objects
    "src/jcvi/**/*.c",   # Generated C files
]

[tool.pytest.ini_options]
addopts = "-v --cov=jcvi --cov-branch --cov-report=xml --cov-report=term"
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = []

[tool.isort]
profile = "black"
known_third_party = ["Bio", "pandas", "numpy"]
known_first_party = ["jcvi"]
default_section = "THIRDPARTY"
force_sort_within_sections = true

[tool.numpydoc_validation]
checks = [
    "all",  # report on all checks
    "ES01", # but don't require an extended summary
    "EX01", # or examples
    "SA01", # or a see also section
    "SS06", # and don't require the summary to fit on one line
]
exclude = [ # don't report on checks for these
    '\.__init__$',
    '\.__repr__$',
    '\.__str__$',
]
override_SS05 = [ # allow docstrings to start with these words
    '^Process ',
    '^Assess ',
    '^Access ',
]
